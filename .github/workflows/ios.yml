name: iPhone build and tests
on:
  push:
    paths: ['iphone/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Test native app
        run: >-
          xcodebuild test -project iphone/FindVehicle.xcodeproj -scheme FindVehicle
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build for physical iPhone without signing
        run: >-
          xcodebuild build -project iphone/FindVehicle.xcodeproj -scheme FindVehicle
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
